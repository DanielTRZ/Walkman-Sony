<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Sony Walkman TPS-L2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="walkman">
        <!-- Pomarańczowy przycisk na górze -->
        <div class="top-button"></div>

        <!-- Lewy panel boczny -->
        <div class="left-side-panel">
            <div class="jack-socket"></div>
            <div class="jack-socket"></div>
        </div>

        <!-- Główny korpus -->
        <div class="main-body">
            <!-- Górna linia podziału obudowy -->
            <div class="body-split-line"></div>

            <!-- Napisy -->
            <div class="sony-brand">SONY</div>
            <div class="sony-sub">STEREO CASSETTE PLAYER TPS-L2</div>
            
            <!-- Napis STEREO  -->
            <div class="stereo-label">STEREO</div>

            <!-- Okno kasety -->
            <div class="cassette-window">
                <div class="cassette-label">
                    <div class="spool-top">
                        <div class="teeth"></div>
                    </div>
                    <div class="tape-center"></div>
                    <div class="spool-bottom">
                        <div class="teeth"></div>
                    </div>
                </div>
            </div>

            <!-- STRZAŁKA -->
            <div class="sony-arrow">
            <div class="arrow-fix"></div>
             </div>
    

            <!-- Dioda na dole -->
            <div class="led-dot"></div>
             <div class="open-1"></div>
        </div>
           
        <!-- Prawy srebrny panel -->
        <div class="right-silver-panel">
            <div class="panel-screw top"></div>
            <div class="panel-screw bottom"></div>
        </div>
    </div>

</body>
</html>
